kind = "web"
previewPath = "/"
title = "HackSphere"
description = "A developer platform for discovering hackathons, forming teams, submitting projects, and finding personalized build opportunities."
version = "1.0.0"
id = "artifacts/hacksphere"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19924

[services.development]
run = "pnpm --filter @workspace/hacksphere run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/hacksphere", "run", "build" ]
serve = "static"
publicDir = "artifacts/hacksphere/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19924"
BASE_PATH = "/"
